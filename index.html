const PORT = 8084;              // WebSocket aman (wss), lihat angka di halaman overview EMQX Cloud
const USER = "WEB_MONITORING";                // kosongkan untuk broker publik; isi jika pakai EMQX Cloud

const TOPIK_DATA   = "alfian-x7k2/monitoring/data";
const TOPIK_STATUS = "alfian-x7k2/monitoring/status";
const TOPIK_KONTROL = "alfian-x7k2/monitoring/kontrol";  // perintah dari HP ke ESP32

// Keadaan terakhir yang dilaporkan ESP32; tampilan selalu mengikuti laporan ESP32, bukan tebakan.

const menunggu = { lampu:false, kipas:false };  // tombol dikunci sampai ESP32 mengonfirmasi

function perbaruiKontrol() {
  const siap = st.tersambung && st.online && st.mode !== null;
  const manual = st.mode === "manual";
  $("m-otomatis").className = st.mode === "otomatis" ? "aktif" : "";
  $("m-manual").className = manual ? "aktif" : "";

    $("on-" + alat).className = "b-on" + (st.data && nyala ? " aktif" : "");
    $("off-" + alat).className = "b-off" + (st.data && !nyala ? " aktif" : "");
    $("on-" + alat).disabled = $("off-" + alat).disabled = !siap || menunggu[alat];

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoring Suhu</title>
<meta name="theme-color" content="#12161c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1c2430; --muted:#6b7785; --on:#16a34a; --off:#c7ced6; --warn:#dc2626; --btn:#0284c7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1b212a; --text:#e8edf2; --muted:#93a0ae; --off:#3a4452; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
  h1 { font-size:1.2rem; margin:0 0 4px; }
  #koneksi { font-size:.85rem; color:var(--muted); margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; max-width:720px; }
  .card { background:var(--card); border-radius:12px; padding:16px; }
  .label { font-size:.8rem; color:var(--muted); }
  .nilai { font-size:2rem; font-weight:600; margin-top:6px; }
  .dot { display:inline-block; width:14px; height:14px; border-radius:50%; background:var(--off); margin-right:8px; vertical-align:middle; }
  .dot.on { background:var(--on); }
  .dot.warn { background:var(--warn); }
  .status { font-size:1.1rem; margin-top:8px; }

  /* Style Tambahan untuk Tombol & Mode */
  .mode-container { margin-bottom: 16px; max-width:720px; }
  .btn-group { display: flex; gap: 8px; margin-top: 6px; }
  button {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    background: #3a4452;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  button.active { background: var(--btn); }
  button.btn-on { background: var(--on); }
  button.btn-off { background: var(--warn); }
  
  /* Container Tombol Kontrol Manual (Bisa Disembunyikan) */
  #panel-manual { display: none; margin-top: 16px; }
</style>
</head>
<body>
<h1>Monitoring Suhu &amp; Kelembapan</h1>
<div id="koneksi">Menyambung ke server...</div>

<!-- Pilihan Mode -->
<div class="card mode-container">
  <div class="label">Mode Operasi</div>
  <div class="btn-group">
    <button id="btn-auto" class="active" onclick="setMode('otomatis')">Otomatis</button>
    <button id="btn-manual" onclick="setMode('manual')">Manual</button>
  </div>
</div>

<div class="grid">
  <div class="card"><div class="label">Suhu</div><div class="nilai"><span id="suhu">--</span> °C</div></div>
  <div class="card"><div class="label">Kelembapan</div><div class="nilai"><span id="lembab">--</span> %</div></div>
  <div class="card"><div class="label">Cahaya</div><div class="nilai" id="cahaya" style="font-size:1.5rem">--</div></div>
  <div class="card"><div class="label">Lampu</div><div class="status"><span class="dot" id="lampu"></span><span id="t-lampu">--</span></div></div>
  <div class="card"><div class="label">Kipas</div><div class="status"><span class="dot" id="kipas"></span><span id="t-kipas">--</span></div></div>
  <div class="card"><div class="label">Buzzer</div><div class="status"><span class="dot" id="buzzer"></span><span id="t-buzzer">--</span></div></div>
</div>

<!-- Panel Tombol Kontrol Manual (Muncul hanya jika Mode Manual aktif) -->
<div id="panel-manual" class="grid">
  <div class="card">
    <div class="label">Kontrol Lampu</div>
    <div class="btn-group">
      <button class="btn-on" onclick="kirimKontrol('lampu', 1)">ON</button>
      <button class="btn-off" onclick="kirimKontrol('lampu', 0)">OFF</button>
    </div>
  </div>
  <div class="card">
    <div class="label">Kontrol Kipas</div>
    <div class="btn-group">
      <button class="btn-on" onclick="kirimKontrol('kipas', 0)">ON</button>
      <button class="btn-off" onclick="kirimKontrol('kipas', 1)">OFF</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const HOST = "i317fd82.ala.asia-southeast1.emqxsl.com";
const PORT = 8084;
const USER = "WEB_MONITORING";
const PASS = "monitor123";
const TOPIK_DATA    = "DANI-x7k2/monitoring/data";
const TOPIK_STATUS  = "DANI-x7k2/monitoring/status";
const TOPIK_KONTROL = "DANI-x7k2/monitoring/kontrol"; // Topik untuk kirim perintah

const $ = id => document.getElementById(id);

function lampu(id, aktif, warn) {
  $(id).className = "dot" + (aktif ? (warn ? " warn" : " on") : "");
  $("t-" + id).textContent = aktif ? "ON" : "OFF";
}

// Fungsi Mengatur Tampilan Tombol Mode
function setMode(mode) {
  if (mode === 'otomatis') {
    $("btn-auto").classList.add("active");
    $("btn-manual").classList.remove("active");
    $("panel-manual").style.display = "none"; // Sembunyikan tombol ON/OFF
  } else {
    $("btn-manual").classList.add("active");
    $("btn-auto").classList.remove("active");
    $("panel-manual").style.display = "grid"; // Tampilkan tombol ON/OFF
  }
  
  // Kirim status mode ke MQTT
  if (client && client.connected) {
    client.publish(TOPIK_KONTROL, JSON.stringify({ mode: mode }));
  }
}

// Fungsi Kirim Perintah ON/OFF
function kirimKontrol(perangkat, nilai) {
  if (client && client.connected) {
    // Mengirim JSON, misal: {"lampu": 1} atau {"kipas": 0}
    const payload = JSON.stringify({ [perangkat]: nilai });
    client.publish(TOPIK_KONTROL, payload);
  }
}

const client = mqtt.connect("wss://" + HOST + ":" + PORT + "/mqtt", USER ? { username: USER, password: PASS } : {});

client.on("connect", () => {
  $("koneksi").textContent = "Server tersambung, menunggu ESP32...";
  client.subscribe([TOPIK_DATA, TOPIK_STATUS]);
});

client.on("close", () => { $("koneksi").textContent = "Terputus dari server, mencoba lagi..."; });

client.on("message", (topik, pesan) => {
  const isi = pesan.toString();
  if (topik === TOPIK_STATUS) {
    $("koneksi").textContent = isi === "online" ? "ESP32 online" : "ESP32 offline (data di bawah adalah yang terakhir)";
    return;
  }
  try {
    const d = JSON.parse(isi);
    $("suhu").textContent = d.suhu.toFixed(1);
    $("lembab").textContent = d.lembab.toFixed(1);
    $("cahaya").textContent = d.gelap ? "Gelap" : "Terang";
    lampu("lampu", d.lampu);
    lampu("kipas", d.kipas);
    lampu("buzzer", d.buzzer, true);
  } catch (e) { console.error("Data tidak valid:", e); }
});
</script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
